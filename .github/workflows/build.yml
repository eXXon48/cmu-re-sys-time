name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest parses, the hook payload is a diff that adds one line
        run: |
          python3 -m json.tool pkg/manifest.json >/dev/null
          f=pkg/payload/start_normal_mode.sh.diff
          head -n 2 "$f" | grep -q '^--- a$' && [ "$(grep -c '^+[^+]' "$f")" = 1 ] && [ "$(grep -c '^-[^-]' "$f")" = 0 ]
      - name: set-clock.sh tests
        run: |
          sh -n pkg/payload/bin/set-clock.sh
          sh test/run.sh
      - name: Timed-wait fix (host test, ARM build, export check)
        run: |
          python3 -m pip install --user ziglang==0.14.1
          ZIG="python3 -m ziglang" sh tools/build-timefix.sh

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RVP_STORE_REV: 603c02925ca2417736d3726675de7d3aa3fa2eed
    steps:
      - uses: actions/checkout@v4

      - name: Checkout store (rvp-pack source)
        uses: actions/checkout@v4
        with:
          repository: eXXon48/cmu-re-store
          ref: ${{ env.RVP_STORE_REV }}
          token: ${{ secrets.STORE_READ_TOKEN }}
          path: store
          persist-credentials: false

      - name: Build rvp-pack
        working-directory: store
        run: |
          rustup toolchain install
          cargo build --release --offline --bin rvp-pack

      - name: Build the timed-wait fix
        run: |
          python3 -m pip install --user ziglang==0.14.1
          ZIG="python3 -m ziglang" sh tools/build-timefix.sh

      - name: Pack Revised Store package
        run: |
          VER=${GITHUB_REF_NAME#v}; echo "VER=$VER" >> "$GITHUB_ENV"
          sh tools/mkpkg.sh "$VER" store/target/release/rvp-pack "cmu-re-sys-time-$VER.rvp"
          sha256sum "cmu-re-sys-time-$VER.rvp" | tee "cmu-re-sys-time-$VER.rvp.sha256"

      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cmu-re-sys-time-${{ env.VER }}.rvp
            cmu-re-sys-time-${{ env.VER }}.rvp.sha256
